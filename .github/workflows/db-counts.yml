name: DB counts

# 只读：统计数据库里文章、评论、留言、公告的数量（ZB-8 切换前后各跑一次对比），只输出数字。
# 连接信息和 server-secrets.yml 用同一组 secrets，经 stdin 交给服务器上的 zacblog-secrets.sh counts。
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  counts:
    name: count content rows
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      REMOTE_HOME: /home/ZacBlog
      MODE: counts
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/scripts

      - name: Check secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD_CURRENT: ${{ secrets.DB_PASSWORD_CURRENT }}
          DB_PASSWORD_NEW: ${{ secrets.DB_PASSWORD_NEW }}
          JWT_SECRET_NEW: ${{ secrets.JWT_SECRET_NEW }}
        run: |
          set -euo pipefail
          missing=''
          for name in SSH_HOST SSH_PORT SSH_USER DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD_CURRENT DB_PASSWORD_NEW JWT_SECRET_NEW; do
            value=${!name}
            if [ -z "$value" ]; then
              missing="$missing $name"
              continue
            fi
            # GitHub 已经会遮盖 secrets；这里再显式遮盖一次（只对单行值有效，多行值由服务器端脚本拒绝）
            case "$value" in *$'\n'*) ;; *) echo "::add-mask::$value" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::production 环境缺少 secrets:$missing"
            exit 1
          fi
          echo "secrets 齐全（只检查是否为空，不打印值）"

      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          # production 环境变量：服务器的 host key（known_hosts 格式，主人已核对指纹）
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::production 环境缺少变量 SSH_KNOWN_HOSTS，拒绝在不校验服务器身份的情况下连接"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF
          ssh prod 'echo "SSH OK: $(whoami)"'

      - name: Upload scripts
        run: |
          set -euo pipefail
          ssh prod "mkdir -p $REMOTE_HOME/scripts"
          scp deploy/scripts/zacblog-*.sh "prod:$REMOTE_HOME/scripts/"
          ssh prod "chmod 755 $REMOTE_HOME/scripts/zacblog-*.sh"

      - name: Run zacblog-secrets.sh counts
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD_CURRENT: ${{ secrets.DB_PASSWORD_CURRENT }}
          DB_PASSWORD_NEW: ${{ secrets.DB_PASSWORD_NEW }}
          JWT_SECRET_NEW: ${{ secrets.JWT_SECRET_NEW }}
        run: |
          set -euo pipefail
          # printf 是 bash 内建命令：值不会出现在任何进程的参数里；整段经 ssh 的 stdin 送到服务器
          {
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD_CURRENT=%s\n' "$DB_PASSWORD_CURRENT"
            printf 'DB_PASSWORD_NEW=%s\n' "$DB_PASSWORD_NEW"
            printf 'JWT_SECRET_NEW=%s\n' "$JWT_SECRET_NEW"
          } | ssh prod "bash $REMOTE_HOME/scripts/zacblog-secrets.sh $MODE"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
