name: Server secrets

# 生成服务器上的环境变量文件 / 轮换数据库密码，见 docs/deploy.md「环境变量文件和密码轮换」。
#   rotate_db_password=false：写 /home/ZacBlog/server/zacblog.env（600），不重启服务
#   rotate_db_password=true： ALTER USER 改成 DB_PASSWORD_NEW → 写进环境变量文件 → 重启 + 健康检查；
#                             失败时密码改回原值、恢复环境变量文件、再重启（只能在切换完成后运行）
# 密钥只通过 stdin 交给服务器上的 zacblog-secrets.sh，不出现在命令行参数和日志里。
on:
  workflow_dispatch:
    inputs:
      rotate_db_password:
        description: '轮换数据库密码（false 只写环境变量文件）'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# 和 Deploy 共用一个并发组：两者不会同时改服务器
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  secrets:
    name: ${{ inputs.rotate_db_password && 'rotate DB password' || 'write env file' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      REMOTE_HOME: /home/ZacBlog
      MODE: ${{ inputs.rotate_db_password && 'rotate' || 'write-env' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/scripts

      - name: Check secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD_CURRENT: ${{ secrets.DB_PASSWORD_CURRENT }}
          DB_PASSWORD_NEW: ${{ secrets.DB_PASSWORD_NEW }}
          JWT_SECRET_NEW: ${{ secrets.JWT_SECRET_NEW }}
        run: |
          set -euo pipefail
          missing='' multiline=''
          for name in SSH_HOST SSH_PORT SSH_USER DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD_CURRENT DB_PASSWORD_NEW JWT_SECRET_NEW; do
            value=${!name}
            if [ -z "$value" ]; then
              missing="$missing $name"
              continue
            fi
            # 含换行的值：::add-mask:: 只能遮盖单行，片段可能漏进日志，所以直接拒绝（只报名字）
            case "$value" in
              *$'\n'* | *$'\r'*) multiline="$multiline $name" ;;
              *) echo "::add-mask::$value" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::production 环境缺少 secrets:$missing"
            exit 1
          fi
          if [ -n "$multiline" ]; then
            echo "::error::这些 secrets 含换行，请重新设置为单行值（生成时用 tr -d '\\n'）:$multiline"
            exit 1
          fi
          echo "secrets 齐全且都是单行（不打印值）"

      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          # production 环境变量：服务器的 host key（known_hosts 格式，主人已核对指纹）
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::production 环境缺少变量 SSH_KNOWN_HOSTS，拒绝在不校验服务器身份的情况下连接"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF
          ssh prod 'echo "SSH OK: $(whoami)"'

      - name: Upload scripts
        run: |
          set -euo pipefail
          ssh prod "mkdir -p $REMOTE_HOME/scripts"
          scp deploy/scripts/zacblog-*.sh "prod:$REMOTE_HOME/scripts/"
          ssh prod "chmod 755 $REMOTE_HOME/scripts/zacblog-*.sh"

      - name: Run zacblog-secrets.sh ${{ inputs.rotate_db_password && 'rotate' || 'write-env' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD_CURRENT: ${{ secrets.DB_PASSWORD_CURRENT }}
          DB_PASSWORD_NEW: ${{ secrets.DB_PASSWORD_NEW }}
          JWT_SECRET_NEW: ${{ secrets.JWT_SECRET_NEW }}
        run: |
          set -euo pipefail
          # 再挡一次多行值（上一步已经检查过）：不能把续行送到服务器
          for name in DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD_CURRENT DB_PASSWORD_NEW JWT_SECRET_NEW; do
            case "${!name}" in *$'\n'* | *$'\r'*) echo "::error::$name 含换行，未发送"; exit 1 ;; esac
          done
          # printf 是 bash 内建命令：值不会出现在任何进程的参数里；整段经 ssh 的 stdin 送到服务器
          {
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD_CURRENT=%s\n' "$DB_PASSWORD_CURRENT"
            printf 'DB_PASSWORD_NEW=%s\n' "$DB_PASSWORD_NEW"
            printf 'JWT_SECRET_NEW=%s\n' "$JWT_SECRET_NEW"
          } | ssh prod "bash $REMOTE_HOME/scripts/zacblog-secrets.sh $MODE"

      - name: Show env file mode and app.log tail
        if: always()
        run: |
          ssh prod "stat -c '%a %U %n' $REMOTE_HOME/server/zacblog.env" || true
          if [ "$MODE" = rotate ]; then ssh prod "tail -n 50 $REMOTE_HOME/server/app.log" || true; fi

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
