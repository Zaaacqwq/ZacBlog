name: Deploy

# push 到 main 且 server/ 或 web/ 有改动时自动部署（deploy job 仍要主人在 production 环境批准）；也可以手动触发。
# 服务器上的流程见 docs/deploy.md：备份 → 发布前端 → 启动新后端 + 健康检查，失败自动回滚。
on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - "web/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build (server jar + web dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build server
        working-directory: server
        run: mvn -B package

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-deploy
          # server/pom.xml 设了 <finalName>zacblog-server</finalName>：可执行 jar 就是这个文件名
          #（旁边的 zacblog-server.jar.original 是不含依赖的普通 jar，不能用）
          jar=server/target/zacblog-server.jar
          [ -f "$jar" ] || { echo "::error::没有 $jar（pom 的 finalName 改过？）"; ls -l server/target; exit 1; }
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q '^Start-Class: vip.zaaac.blog.BlogApplication' ||
            { echo "::error::$jar 不是 Spring Boot 可执行 jar"; exit 1; }
          [ -f web/dist/index.html ] || { echo "::error::web/dist/index.html 不存在"; exit 1; }
          cp "$jar" "dist-deploy/zacblog-server-${GITHUB_SHA::12}.jar"
          tar -czf dist-deploy/web-dist.tgz -C web/dist .
          ls -l dist-deploy

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: dist-deploy/
          retention-days: 7

  deploy:
    name: deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      REMOTE_HOME: /home/ZacBlog
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/scripts

      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: dist-deploy

      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          # production 环境变量：服务器的 host key（known_hosts 格式，主人已核对指纹）
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::production 环境缺少变量 SSH_KNOWN_HOSTS，拒绝在不校验服务器身份的情况下连接"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF
          ssh prod 'echo "SSH OK: $(whoami)"'

      - name: Upload scripts and artifacts
        run: |
          set -euo pipefail
          # build job 只放了一个 jar；不是正好一个就停下，不去猜
          shopt -s nullglob
          jars=(dist-deploy/zacblog-server-*.jar)
          if [ "${#jars[@]}" -ne 1 ] || [ ! -f dist-deploy/web-dist.tgz ]; then
            echo "::error::产物不对：期望正好一个 zacblog-server-*.jar 和 web-dist.tgz"; ls -l dist-deploy; exit 1
          fi
          jar=$(basename "${jars[0]}")
          echo "JAR=$jar" >> "$GITHUB_ENV"
          ssh prod "mkdir -p $REMOTE_HOME/scripts $REMOTE_HOME/incoming"
          scp deploy/scripts/zacblog-*.sh "prod:$REMOTE_HOME/scripts/"
          ssh prod "chmod 755 $REMOTE_HOME/scripts/zacblog-*.sh"
          scp "dist-deploy/$jar" dist-deploy/web-dist.tgz "prod:$REMOTE_HOME/incoming/"

      - name: Backup, publish frontend, start, health check (auto rollback)
        run: |
          set -euo pipefail
          jar=$JAR
          ssh prod "bash $REMOTE_HOME/scripts/zacblog-deploy.sh $REMOTE_HOME/incoming/$jar $REMOTE_HOME/incoming/web-dist.tgz"
          ssh prod "rm -f $REMOTE_HOME/incoming/$jar $REMOTE_HOME/incoming/web-dist.tgz"

      - name: Show app.log tail
        if: failure()
        run: ssh prod "tail -n 100 $REMOTE_HOME/server/app.log" || true

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
