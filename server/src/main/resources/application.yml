# 所有可变配置都从环境变量读取；这里只允许出现占位符和无害的本地默认值，不能写真实密码或密钥。
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: zacblog-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zaaac_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 线上库已有旧表：首次接入时以当前结构为基线
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

blog:
  jwt:
    # 必须通过环境变量 JWT_SECRET 提供，没有默认值
    secret: ${JWT_SECRET:}
  upload-path: ${UPLOAD_PATH:/home/ZacBlog/zaaac/uploadPath}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
